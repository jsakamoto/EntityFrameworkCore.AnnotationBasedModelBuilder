name: unit tests

on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v5

      # Install .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # .NET 11 is still in RC, so it needs the preview quality
      - name: Setup .NET SDK 11 (RC)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # Run tests
      - name: Run tests
        working-directory: EFCore.AnnotationBasedModelBuilder.Test
        run: dotnet test --output detailed
